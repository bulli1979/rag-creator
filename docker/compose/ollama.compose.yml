# Gemeinsamer Ollama-Server
services:
  ollama:
    profiles: [ollama, llm, full]
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    networks: [rag-net]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
