# Einmaliges Laden von Modellen in den gemeinsamen rag-ollama-Container
# Beispiel: docker compose -f compose.yml --profile ollama --profile model-llama32 up -d
#           docker compose -f compose.yml --profile model-mistral run --rm ollama-pull-mistral
services:
  ollama-pull-llama32:
    profiles: [model-llama32]
    image: ollama/ollama:latest
    networks: [rag-net]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.2"]
    depends_on:
      ollama:
        condition: service_started

  ollama-pull-llama31-8b:
    profiles: [model-llama31-8b]
    image: ollama/ollama:latest
    networks: [rag-net]
    environment:
