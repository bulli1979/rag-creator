# documentApi
services:
  api:
    profiles: [backend, full]
    container_name: rag-api
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    networks: [rag-net]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      RAG_DATA_ROOT: ${RAG_DATA_ROOT:-/data}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      DOCUMENT_API_HOST: 0.0.0.0
      RAG_DEFAULT_API_KEY: ${RAG_DEFAULT_API_KEY:-}
      RAG_ADMIN_API_KEY: ${RAG_ADMIN_API_KEY:-}
      NOTBOT_AUDIT_KEY: ${NOTBOT_AUDIT_KEY:-}
    volumes:
      - rag_api_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

volumes:
  rag_api_data:
